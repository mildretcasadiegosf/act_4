name: CI/CD Pipeline - Test Suite

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main
      - develop
      - 'feature/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # JOB 1: Linting y Type Checking
  # ============================================================================
  lint-and-type-check:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout del código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔧 Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Instalar dependencias
        run: npm ci --legacy-peer-deps

      - name: ✅ Verificar tipos TypeScript
        run: npx tsc --noEmit
        
      - name: 🎨 Ejecutar ESLint
        run: npx eslint . --ext .ts,.tsx --max-warnings 0
        continue-on-error: true

  # ============================================================================
  # JOB 2: Pruebas Unificadas (Unitarias, Componentes, Integración)
  # ============================================================================
  test:
    name: Unified Test Suite
    runs-on: ubuntu-latest
    needs: lint-and-type-check
    
    steps:
      - name: 📥 Checkout del código
        uses: actions/checkout@v4

      - name: 🔧 Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Instalar dependencias
        run: npm ci --legacy-peer-deps

      - name: 🧪 Ejecutar pruebas unitarias
        run: npm test -- --testPathPattern="(^(?!.*integration|.*component|.*contract|.*a11y).)*\.test\.(ts|tsx)$" --coverage

      - name: 🧩 Ejecutar pruebas de componentes
        run: npm test -- --testPathPattern="components/" --coverage

      - name: 🔗 Ejecutar pruebas de integración
        run: npm test -- --testPathPattern="integration/" --coverage

      - name: 📋 Ejecutar pruebas de contrato
        run: npm test -- --testPathPattern="contract/" --coverage

      - name: 📊 Generar reporte de cobertura consolidado
        run: npm test -- --coverage --ci

      - name: ✅ Validar umbral de cobertura (≥70%)
        run: |
          echo "═══════════════════════════════════════════════════════════"
          echo "  📊 VERIFICACIÓN DE COBERTURA (Umbral: 70%)"
          echo "═══════════════════════════════════════════════════════════"
          
          COVERAGE_FILE="./coverage/coverage-summary.json"
          
          if [ ! -f "$COVERAGE_FILE" ]; then
            echo "❌ Error: No se encontró el archivo de cobertura"
            exit 1
          fi
          
          # Extraer métricas de cobertura
          STATEMENTS=$(node -e "console.log(Math.round(require('$COVERAGE_FILE').total.statements.pct))")
          BRANCHES=$(node -e "console.log(Math.round(require('$COVERAGE_FILE').total.branches.pct))")
          FUNCTIONS=$(node -e "console.log(Math.round(require('$COVERAGE_FILE').total.functions.pct))")
          LINES=$(node -e "console.log(Math.round(require('$COVERAGE_FILE').total.lines.pct))")
          
          THRESHOLD=70
          FAILED=false
          
          echo ""
          echo "📈 Métricas de Cobertura:"
          echo "   Statements: $STATEMENTS% (umbral: $THRESHOLD%)"
          echo "   Branches:   $BRANCHES% (umbral: $THRESHOLD%)"
          echo "   Functions:  $FUNCTIONS% (umbral: $THRESHOLD%)"
          echo "   Lines:      $LINES% (umbral: $THRESHOLD%)"
          echo ""
          
          if [ "$STATEMENTS" -lt "$THRESHOLD" ]; then
            echo "❌ Statements: $STATEMENTS% < $THRESHOLD%"
            FAILED=true
          else
            echo "✅ Statements: $STATEMENTS% ≥ $THRESHOLD%"
          fi
          
          if [ "$BRANCHES" -lt "$THRESHOLD" ]; then
            echo "❌ Branches: $BRANCHES% < $THRESHOLD%"
            FAILED=true
          else
            echo "✅ Branches: $BRANCHES% ≥ $THRESHOLD%"
          fi
          
          if [ "$FUNCTIONS" -lt "$THRESHOLD" ]; then
            echo "❌ Functions: $FUNCTIONS% < $THRESHOLD%"
            FAILED=true
          else
            echo "✅ Functions: $FUNCTIONS% ≥ $THRESHOLD%"
          fi
          
          if [ "$LINES" -lt "$THRESHOLD" ]; then
            echo "❌ Lines: $LINES% < $THRESHOLD%"
            FAILED=true
          else
            echo "✅ Lines: $LINES% ≥ $THRESHOLD%"
          fi
          
          echo ""
          echo "═══════════════════════════════════════════════════════════"
          
          if [ "$FAILED" = true ]; then
            echo "❌ FALLA: Cobertura por debajo del 70% requerido"
            exit 1
          else
            echo "✅ ÉXITO: Cobertura cumple el umbral mínimo del 70%"
            exit 0
          fi

      - name: 📤 Subir reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 60

      - name: 💬 Comentar cobertura en PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const coveragePath = './coverage/coverage-summary.json';
            
            if (fs.existsSync(coveragePath)) {
              const coverage = JSON.parse(fs.readFileSync(coveragePath, 'utf-8'));
              const total = coverage.total;
              
              const comment = `## 📊 Coverage Report
              
              | Métrica | Cobertura | Estado |
              |---------|-----------|--------|
              | Statements | ${Math.round(total.statements.pct)}% | ${Math.round(total.statements.pct) >= 70 ? '✅' : '❌'} |
              | Branches | ${Math.round(total.branches.pct)}% | ${Math.round(total.branches.pct) >= 70 ? '✅' : '❌'} |
              | Functions | ${Math.round(total.functions.pct)}% | ${Math.round(total.functions.pct) >= 70 ? '✅' : '❌'} |
              | Lines | ${Math.round(total.lines.pct)}% | ${Math.round(total.lines.pct) >= 70 ? '✅' : '❌'} |
              
              Umbral requerido: **70%**
              `;
              
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            }

  # ============================================================================
  # JOB 4: Seguridad y Análisis Estático
  # ============================================================================
  security-check:
   name: Security & Static Analysis
   runs-on: ubuntu-latest
    
   steps:
     - name: 📥 Checkout del código
       uses: actions/checkout@v4

     - name: 🔧 Configurar Node.js
       uses: actions/setup-node@v4
       with:
         node-version: '20'
         cache: 'npm'

     - name: 📦 Instalar dependencias
       run: npm ci --legacy-peer-deps

     - name: 🔍 Auditoría de dependencias
       run: npm audit --audit-level=moderate
       continue-on-error: true

     - name: 🚨 Verificación de secretos
       uses: trufflesecurity/trufflehog@main
       with:
         path: ./
         base: ${{ github.event.repository.default_branch }}
         head: HEAD
         extra_args: --debug

  # ============================================================================
  # JOB 5: Resumen Final y Notificación
  # ============================================================================
  summary:
    name: Pipeline Summary
    runs-on: ubuntu-latest
    needs: [lint-and-type-check, test, security-check]
    if: always()
    
    steps:
      - name: ✅ Verificar estado del pipeline
        run: |
          echo "═══════════════════════════════════════════════════════════"
          echo "  CI/CD PIPELINE SUMMARY"
          echo "═══════════════════════════════════════════════════════════"
          echo ""
          echo "✓ Linting & Type Check: ${{ needs.lint-and-type-check.result }}"
          echo "✓ Unified Test Suite (Unit/Component/Integration): ${{ needs.test.result }}"
          echo "✓ Security Check: ${{ needs.security-check.result }}"
          echo ""
          echo "═══════════════════════════════════════════════════════════"
        
      - name: ❌ Fallar si algún job falló
        if: |
          needs.lint-and-type-check.result == 'failure' ||
          needs.test.result == 'failure' ||
          needs.security-check.result == 'failure'
        run: exit 1
